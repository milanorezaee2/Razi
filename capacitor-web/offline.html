<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e2230" />
    <title>اتصال برقرار نشد · پنل مدیریت رزی</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f4ef; color: #1e2230; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #e9dfd2; border-radius: 1.5rem; background: white; text-align: center; }
      h1 { margin: 0 0 1rem; font-size: 1.4rem; }
      p { margin: 0; color: #64616a; line-height: 1.9; }
      button { margin-top: 1.5rem; border: 0; border-radius: 999px; background: #b5713a; color: white; padding: .8rem 1.4rem; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>اتصال به پنل مدیریت رزی برقرار نشد</h1>
      <p>برای دسترسی امن به پنل، اینترنت لازم است و اطلاعات مدیریتی روی دستگاه ذخیره نمی‌شوند. اتصال را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
